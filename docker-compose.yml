services:
  nafpt:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./profile.md:/app/profile.md:ro
      - ./policies.md:/app/policies.md:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/app/data/heartbeat')<900 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
